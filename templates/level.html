{% extends "base.html" %}
{% block title %}{{ level.name }} — Прохождение{% endblock %}
{% set active = 'courses' %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/lesson.css') }}">
<div class="level-container ml-lesson">
    <nav class="lesson-nav"><a href="/topic/{{ topic.id }}">← К урокам темы</a><span>РЕЖИМ ОБУЧЕНИЯ</span></nav>
    <div class="lesson-heading"><div><div class="lesson-kicker">{{ topic.name }}</div><h1>{{ level.name }}</h1></div><span class="lesson-count" id="lessonCount">Подготовка</span></div>

    <div class="level-progress">
        <div class="level-progress-bar" role="progressbar" aria-label="Прогресс урока" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="level-progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="level-hearts" id="heartsDisplay"></div>
    </div>

    <div class="question-area" id="questionArea">
        <div class="question-loading">Загрузка...</div>
    </div>

    <div class="feedback-bar" id="feedbackBar">
        <div class="feedback-content" id="feedbackContent" aria-live="polite"></div>
        <button class="btn btn-primary btn-block" id="nextBtn" style="display: none;">Продолжить</button>
    </div>

</div>

<!-- Безопасный JSON -->
<script id="questions-data" type="application/json">
    {{ questions | tojson | safe }}
</script>

{% block scripts %}
<script>
    // Ждем полной загрузки DOM
    document.addEventListener('DOMContentLoaded', () => {
        const rawData = document.getElementById('questions-data').textContent;
        const QUESTIONS = JSON.parse(rawData);
        const LEVEL_ID = {{ level.id }};

        let currentIndex = 0;
        let correctCount = 0;
        let answered = false;
        let saving = false;
        const escapeHtml = value => String(value ?? "").replace(/[&<>"\x27]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\x27":"&#39;"}[ch]));

        // ТЕПЕРЬ Stats ТОЧНО ЕСТЬ, ТАК КАК ОН В HEAD
        let lives = Stats.current.hearts;

        function updateHeartsDisplay() {
            const container = document.getElementById('heartsDisplay');
            if (!container) return;
            let html = '';
            for (let i = 0; i < 5; i++) {
                if (i < lives) {
                    html += '<span style="color: #ef4444; filter: drop-shadow(0 0 2px rgba(239,68,68,0.4));">❤️</span>';
                } else {
                    html += '<span style="color: var(--border); opacity: 0.5;">🤍</span>';
                }
            }
            container.innerHTML = html;
        }

        function updateProgress() {
            const percent = (currentIndex / QUESTIONS.length) * 100;
            document.getElementById('progressFill').style.width = percent + '%';
            document.querySelector('.level-progress-bar').setAttribute('aria-valuenow', String(Math.round(percent)));
            document.getElementById('lessonCount').textContent = 'Вопрос ' + Math.min(currentIndex + 1, QUESTIONS.length) + ' / ' + QUESTIONS.length;
        }

        function renderQuestion() {
            if (currentIndex >= QUESTIONS.length) {
                finishLevel();
                return;
            }

            const q = QUESTIONS[currentIndex];
            const area = document.getElementById('questionArea');
            answered = false;

            const shuffled = [...q.options];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            let html = `
                <div class="question-header">
                    <span class="question-number">ВЫБЕРИ ПРАВИЛЬНЫЙ ОТВЕТ</span>
                </div>
                <h2 class="question-text">${escapeHtml(q.question)}</h2>
                <div class="options-list">
            `;

            shuffled.forEach((opt, i) => {
                const letter = String.fromCharCode(65 + i);
                html += `
                    <button type="button" class="option-btn" data-option-index="${i}">
                        <span class="option-letter">${letter}</span>
                        <span class="option-text">${escapeHtml(opt)}</span><span class="option-indicator" aria-hidden="true"></span>
                    </button>
                `;
            });

            html += '</div>';
            area.innerHTML = html;
            area.querySelectorAll(".option-btn").forEach(button => button.addEventListener("click", () => selectAnswer(String(shuffled[Number(button.dataset.optionIndex)]), button)));
            document.getElementById('feedbackBar').classList.remove('visible');
            document.getElementById('nextBtn').style.display = 'none';
            updateProgress();
            updateHeartsDisplay();
        }

        window.selectAnswer = function(selectedText, btn) {
            if (answered) return;
            answered = true;

            const q = QUESTIONS[currentIndex];
            const isCorrect = selectedText.trim() === q.correct_answer.trim();

            document.querySelectorAll('.option-btn').forEach(b => {
                b.disabled = true;
                b.classList.add('disabled');
            });

            if (isCorrect) {
                btn.classList.add('correct');
                btn.querySelector('.option-indicator').textContent = '✓';
                correctCount++;
            } else {
                btn.classList.add('wrong');
                btn.querySelector('.option-indicator').textContent = '×';
                if (lives > 0) {
                    lives = Stats.removeHeart(); 
                    updateHeartsDisplay();
                }
                document.querySelectorAll('.option-btn').forEach(b => {
                    const optText = b.querySelector('.option-text').textContent.trim();
                    if (optText === q.correct_answer.trim()) { b.classList.add('correct'); b.querySelector('.option-indicator').textContent = '✓'; }
                });
            }

            const feedback = document.getElementById('feedbackBar');
            const content = document.getElementById('feedbackContent');
            content.innerHTML = `
                <div class="feedback-message ${isCorrect ? 'success' : 'error'}">${isCorrect ? 'Верно!' : 'Разберём ошибку'}</div>
                ${q.explanation ? `<div class="feedback-explanation">${escapeHtml(q.explanation)}</div>` : ''}
            `;
            feedback.classList.add('visible');
            feedback.classList.toggle('lesson-correct', isCorrect);
            feedback.classList.toggle('lesson-wrong', !isCorrect);
            const progress = Math.round((currentIndex + 1) / QUESTIONS.length * 100);
            document.getElementById('progressFill').style.width = progress + '%';
            document.querySelector('.level-progress-bar').setAttribute('aria-valuenow', String(progress));
            document.getElementById('nextBtn').style.display = 'block';

            if (lives <= 0) {
                document.getElementById('nextBtn').style.display = 'none';
                setTimeout(() => showOutOfHeartsModal(), 1200);
            }
        };

        function nextQuestion() {
            if (!answered || lives <= 0 || saving) return;
            answered = false;
            currentIndex++;
            renderQuestion();
        }

        async function finishLevel() {
            if (saving) return;
            saving = true;
            document.getElementById("feedbackBar").classList.remove("visible");
            const area = document.getElementById('questionArea');
            area.innerHTML = '<div class="question-loading">Сохранение...</div>';

            try {
                const response = await fetch(`/api/level/${LEVEL_ID}/complete`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ correct: correctCount, total: QUESTIONS.length })
                });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error("Не удалось сохранить результат");
                if (data.success) {
                    Stats.setXp(data.total_xp);
                    Stats.setStreak(data.streak);
                    if (data.level_up) Stats.setLevel(data.new_level);
                    showResult(data);
                }
            } catch (e) {
                console.error(e);
                area.innerHTML = `<div class="question-loading">Не удалось сохранить результат. ${escapeHtml(e.message)}</div>`;
            }
        }

        function showResult(data) {
            const area = document.getElementById('questionArea');
            const stars = '⭐'.repeat(data.stars) + '☆'.repeat(3 - data.stars);

            area.innerHTML = `
                <div class="result-screen">
                    <div class="result-emoji">${data.stars >= 2 ? '🎉' : data.stars >= 1 ? '👍' : '😔'}</div>
                    <h2>${data.stars >= 2 ? 'Отлично!' : data.stars >= 1 ? 'Хорошо!' : 'Попробуй ещё!'}</h2>
                    <div class="result-stars">${stars}</div>
                    <div class="result-stats">
                        <div class="result-stat"><span class="result-stat-icon">✅</span><span>${data.correct} / ${data.total}</span></div>
                        <div class="result-stat"><span class="result-stat-icon">⚡</span><span>+${data.xp_earned} XP</span></div>
                        <div class="result-stat"><span class="result-stat-icon">📊</span><span>${data.percent}%</span></div>
                    </div>
                    <div class="result-actions">
                        <a href="/topic/{{ topic.id }}" class="btn btn-primary btn-lg">Продолжить</a>
                        <a href="/level/{{ level.id }}" class="btn btn-outline btn-lg">Пройти заново</a>
                    </div>
                </div>
            `;
            document.getElementById('progressFill').style.width = '100%';
            document.querySelector('.level-progress-bar').setAttribute('aria-valuenow','100');
            document.getElementById('lessonCount').textContent = 'Результат';
            document.getElementById('feedbackBar').classList.remove('visible');

            if (data.xp_earned > 0) Toast.show('xp', `+${data.xp_earned} XP`, 'Опыт добавлен в копилку');
            if (data.goal_reached) setTimeout(() => Toast.show('success', 'Цель дня выполнена! ✅', `Стрик: ${data.streak} дн. 🔥`), 800);
            if (data.new_achievements) {
                data.new_achievements.forEach((ach, i) => setTimeout(() => Toast.show('level', 'Новое достижение!', ach), 1200 + i * 500));
            }
        }

        document.getElementById('nextBtn').addEventListener('click', nextQuestion);

        if (QUESTIONS && QUESTIONS.length > 0) {
            renderQuestion();
        } else {
            document.getElementById('questionArea').innerHTML = '<div class="question-loading">В этом уровне пока нет вопросов.</div>';
        }
    });
</script>
{% endblock %}


{% endblock %}
